[project]
name = "comiset"
version = "0.3"
description = "Mineração de processos na COMISET: noções de caso para eventos Windows maliciosos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "pm4py>=2.7.23.8",
    "skpm>=0.1.0",
    "graphviz>=0.21",
    "psutil>=7.2.2",
    "seaborn>=0.13.2",
    "r4pm>=0.6.2",
    "pyarrow>=25.0.1",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "ipyfilechooser>=0.6.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.414",
]

[tool.pyright]
# o app e o núcleo em modo strict; o resto (os notebooks) segue no standard, como no VS Code
include = ["app.py", "util.py", "sean", "interface"]
typeCheckingMode = "standard"
strict = ["app.py", "util.py", "sean", "interface"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
